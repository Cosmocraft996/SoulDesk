<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片格式转换</title>  <script type="module" crossorigin src="./app.js"></script>
  <link rel="stylesheet" crossorigin href="./style.css">
</head><body><main class="convert-container"><button id="pick" class="upload-area" type="button"><span class="image-icon">▧</span><span>将图片拖到这里，或点击从本地选择</span><small>HEIC、JPG、PNG、WEBP、BMP、ICO及系统支持的常见图片；最多32张、合计16 MiB</small></button><form id="options"><div class="settings-area"><label>目标格式<select id="format"><option value="jpg">JPG</option><option value="png">PNG</option><option value="webp">WEBP</option><option value="bmp">BMP</option><option value="ico">ICO</option></select></label><label>宽度<input id="width" type="number" min="1" max="16384" placeholder="原始"></label><label>高度<input id="height" type="number" min="1" max="16384" placeholder="原始"></label><label><input id="aspect" type="checkbox">保持比例</label></div><div class="actions"><button id="convert" type="submit">转换并保存</button><button id="save-settings" type="button">保存设置</button><button id="retry-save" type="button" hidden>保存转换结果</button><button id="clear" type="button">清空列表</button></div></form><output id="status" role="status">正在连接宿主…</output><div class="file-list"><table><thead><tr><th>文件名</th><th>大小</th><th>状态</th><th>操作</th></tr></thead><tbody id="files"></tbody></table></div></main></body></html>
