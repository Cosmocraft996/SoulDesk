<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>喝水提醒</title><link rel="stylesheet" href="./style.css"></head>
<body><main id="water"><div class="circle"><canvas id="canvas" aria-hidden="true"></canvas><span id="count" class="count">—/8</span><div class="border"></div></div><span id="daily" class="title">每天8杯水</span><button id="reset" class="control reset" title="今日杯数归零" aria-label="今日杯数归零">↻</button><button id="add" class="control add" title="喝一杯" aria-label="喝一杯">＋</button><button id="settings" title="喝水提醒设置" aria-label="喝水提醒设置">⚙</button><div class="status"><output id="status" role="status"></output><button id="retry" hidden>重试</button></div></main>
<dialog id="config"><form id="form"><h2>喝水提醒设置</h2><label class="toggle"><input id="enableReminder" type="checkbox">启用提醒</label><label>提醒间隔（分钟）<input id="interval" type="number" min="5" max="100" required></label><label>每日目标（杯）<input id="targetCup" type="number" min="1" max="20" required></label><label>背景颜色<input id="background" type="color"></label><label>文字颜色<input id="color" type="color"></label><label>水波颜色<input id="primary" type="color"></label><div class="actions"><button id="save" type="submit">保存</button><button id="close" type="button">关闭</button></div><p id="save-error" role="status"></p></form></dialog><script type="module" src="./app.js"></script></body></html>
