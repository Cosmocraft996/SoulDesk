<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汇率换算</title><link rel="stylesheet" href="./style.css"></head><body>
<main id="component"><header><strong id="title">汇率换算</strong><button id="refresh" aria-label="刷新汇率">⟳</button><button id="settings" aria-label="设置主题">⚙</button></header><div id="changes"></div>
<section class="currency"><div class="currency-title"><img id="flag-0" alt=""><select id="currency-0" aria-label="来源币种"></select></div><div class="value"><span id="symbol-0"></span><input id="amount-0" aria-label="来源金额" type="text" inputmode="decimal" maxlength="83" value="1" autocomplete="off"></div></section>
<section class="currency"><div class="currency-title"><img id="flag-1" alt=""><select id="currency-1" aria-label="目标币种"></select></div><div class="value"><span id="symbol-1"></span><input id="amount-1" aria-label="目标金额" type="text" inputmode="decimal" maxlength="83" placeholder="等待汇率" autocomplete="off"></div></section>
<footer><div id="source">百度公开汇率 · 结果最多8位小数</div><output id="status" role="status">等待公开数据</output></footer></main>
<dialog id="dialog"><form id="theme-form"><label>背景颜色<input name="background" type="color" required></label><label>文字颜色<input name="foreground" type="color" required></label><label>圆角<input name="radius" type="number" min="0" max="40" required></label><output id="theme-error" role="status"></output><div class="actions"><button id="cancel" type="button">取消</button><button type="submit">保存</button></div></form></dialog><script type="module" src="./app.js"></script></body></html>
