<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打工能耗标识</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="content"><header class="title">打工能耗标识<div class="sub-title">WORK ENERGY LABEL</div></header>
<section class="identity"><div class="input-line"><span class="label">生产者名称：</span><span class="value" id="productor-label">牛马冬</span></div><div class="input-line"><span class="label">规 格 型 号：</span><span class="value" id="spec-label">996-007</span></div></section>
<section class="block chart" aria-label="五档能耗标签"><div class="range"><b>能耗低</b><b>中&nbsp;&nbsp;等</b><b>能耗高</b></div><div class="arrows"><div class="arrow" style="--arrow:#1b814a;--width:40px"><span>1</span></div><div class="arrow" style="--arrow:#93bd30;--width:60px"><span>2</span></div><div class="arrow" style="--arrow:#f8d701;--width:80px"><span>3</span></div><div class="arrow" style="--arrow:#f8a002;--width:100px"><span>4</span></div><div class="arrow" style="--arrow:#e30f1b;--width:120px"><span>5</span></div></div><div class="current-container"><div id="current" class="current-level" aria-live="polite"><span id="level">—</span><span class="unit">级</span></div></div></section>
<section class="block monitor"><b>能耗等级=CPU使用率*0.8+内存使用率*0.2</b><hr><div>CPU使用率：<span id="cpu">—</span></div><div>内存使用率：<span id="memory">—</span></div></section>
<footer title="原组件的趣味文案，并非真实能效认证标准">依据国际标准：YYDS 350628-2025</footer><output id="status" role="status"></output><button id="settings" type="button" title="能耗标识设置" aria-label="能耗标识设置">⚙</button></main>
<dialog id="config"><form id="form"><h2>能耗标识设置</h2><label>生产者名称<input id="productor" maxlength="10"></label><label>规格型号<input id="spec" maxlength="10"></label><label>字体大小<input id="fontSize" type="number" min="8" max="24" required></label><label>圆角<input id="radius" type="number" min="0" max="60" required></label><div class="actions"><button id="save" type="submit">保存</button><button id="close" type="button">关闭</button></div><p id="save-error" role="status"></p></form></dialog><script type="module" src="./app.js"></script></body></html>
