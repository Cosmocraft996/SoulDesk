<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>虚拟币</title></head><body><main id="root"><header><div class="coin-title"><img id="logo" alt="币种图标"><strong id="name">Bitcoin</strong></div><div><button id="refresh" type="button" aria-label="刷新">↻</button><button id="settings" type="button" aria-label="虚拟币设置">⚙</button></div></header><div class="identity"><span id="currency">BTC</span><span id="ratio">—</span></div><div id="price">—</div><output id="status" role="status"></output><div class="chart"><canvas id="chart" aria-label="本次运行实际指数采样图"></canvas></div><footer><div id="identity">OKX · BTC-USD · 指数价 Index · USD</div><div id="time">等待源时间</div><div id="basis"></div><div>曲线为本次运行实际采样，不是历史K线；不参与币安警报</div></footer></main><dialog id="config"><form id="form"><h2>虚拟币小组件设置</h2><label>虚拟币<select id="coin"></select></label><label>刷新间隔<select id="refreshMs"><option value="30000">30秒</option><option value="60000">1分钟</option><option value="180000">3分钟</option><option value="300000">5分钟</option></select></label><label>红涨绿跌<input id="upColorRed" type="checkbox"></label><fieldset><legend>本实例网络</legend><label>代理模式<select id="proxyMode"><option value="inherit">跟随主程序</option><option value="direct">直接连接</option><option value="http">HTTP代理</option><option value="socks5">SOCKS5代理</option></select></label><label>主机<input id="proxyHost" type="text" maxlength="253" placeholder="127.0.0.1"></label><label>端口<input id="proxyPort" type="number" min="0" max="65535" placeholder="1080"></label></fieldset><label>背景<input id="background" type="color"></label><label>文字<input id="foreground" type="color"></label><label>主色<input id="primary" type="color"></label><label>边框<input id="border" type="color"></label><label>圆角<input id="radius" type="number" min="0" max="40" required></label><p id="error" role="status"></p><div class="actions"><button id="close" type="button">取消</button><button id="save" type="submit">保存</button></div></form></dialog><script type="module" src="./app.js"></script></body></html>
