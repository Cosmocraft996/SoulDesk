<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仪表盘</title><link rel="stylesheet" href="./style.css"></head>
<body><main><img class="speedometer" src="./speedometer.png" alt="占用率仪表"><img id="hand" class="hand" src="./hitler_hand.png" alt=""><img class="body" src="./hitler_body.png" alt=""><strong id="value" class="value">Mem —</strong><output id="status" role="status"></output><button id="settings" type="button" title="仪表盘设置" aria-label="仪表盘设置">⚙</button></main>
<dialog id="config"><form id="form"><h2>仪表盘设置</h2><label>监控类型<select id="monitorType"><option value="cpu">CPU</option><option value="memory">内存</option><option value="gpu">GPU</option></select></label><label>背景颜色<input id="background" type="color"></label><label>文字颜色<input id="color" type="color"></label><label>圆角<input id="radius" type="number" min="0" max="60" required></label><p class="hint">GPU 显示最繁忙引擎的占用率，驱动未提供数据时显示原因。CPU 和 GPU 首次读取需要等待采样。</p><div class="actions"><button id="save" type="submit">保存</button><button id="close" type="button">关闭</button></div><p id="save-error" role="status"></p></form></dialog><script type="module" src="./app.js"></script></body></html>
