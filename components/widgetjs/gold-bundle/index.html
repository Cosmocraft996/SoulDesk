<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黄金价格</title>  <script type="module" crossorigin src="./app.js"></script>
  <link rel="stylesheet" crossorigin href="./style.css">
</head><body><main id="root"><header><strong>黄金价格</strong><span class="contract">AU99.99</span><div><button id="refresh" type="button" aria-label="刷新">↻</button><button id="settings" type="button" aria-label="黄金设置">⚙</button></div></header><div id="quote" class="quote" tabindex="0" aria-describedby="statistics"><div class="price-line"><div id="price">暂无有效报价</div><span id="change">—</span></div><div id="statistics" class="statistics"><div><span>昨收</span><strong id="previous">—</strong></div><div><span>最高</span><strong id="maximum">—</strong></div><div><span>最低</span><strong id="minimum">—</strong></div></div></div><output id="status" role="status"></output><div class="chart"><canvas id="chart" aria-label="Au99.99当日分时图"></canvas></div><output id="chart-status" role="status"></output><footer><div>上海黄金交易所 · Au99.99 · 最新价 Last · 人民币元/克</div><div>报价由东方财富提供 · 118.AU9999</div><div id="time">等待来源时间</div></footer></main><dialog id="config"><form id="form"><h2>黄金设置</h2><label>背景<input id="background" type="color"></label><label>文字<input id="foreground" type="color"></label><label>主色<input id="primary" type="color"></label><label>边框<input id="border" type="color"></label><label>圆角<input id="radius" type="number" min="0" max="40" required></label><p id="save-error" role="status"></p><div class="actions"><button id="close" type="button">关闭</button><button id="save" type="submit">保存</button></div></form></dialog></body></html>
