<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轮播相册</title><link rel="stylesheet" href="./style.css"></head>
<body><main id="photo" class="photo"><button id="guide" class="tip" type="button">点击设置图片文件夹</button><button id="previous" class="previous" type="button" aria-label="上一张">‹</button><button id="next" class="next" type="button" aria-label="下一张">›</button></main><button id="settings" class="settings" type="button" aria-label="相册设置">⚙</button><output id="status" class="status" role="status"></output>
<dialog id="config"><form id="form"><h2>相册设置</h2><p id="folder">尚未选择文件夹</p><div class="actions"><button id="choose" type="button">选择文件夹</button><button id="refresh" type="button">刷新图片</button><button id="clear" type="button">清除目录</button></div><label>轮播时间（秒）<input id="duration" type="number" min="1" max="86400" required></label><label>随机播放<input id="random" type="checkbox"></label><label>圆角<input id="radius" type="number" min="0" max="80" required></label><p id="config-status" role="status"></p><div class="actions"><button type="submit">保存设置</button><button id="close" type="button">关闭</button></div></form></dialog><script type="module" src="./app.js"></script></body></html>
