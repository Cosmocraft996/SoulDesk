<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>波浪进度</title><link rel="stylesheet" href="./style.css"></head>
<body data-widget="wave"><main id="component" class="wave"><canvas id="wave" aria-hidden="true"></canvas><header><h1 id="title">今天</h1><button id="configure" type="button" aria-label="设置波浪进度">⚙</button></header><p class="remaining-label">剩余</p><output id="percentage" aria-label="剩余百分比">100%</output><p id="status" role="status"></p></main><dialog id="settings"><form id="settings-form"><h2>波浪进度设置</h2><label>进度类型<select name="period"><option value="0">今天</option><option value="1">本周</option><option value="2">本月</option><option value="3">今年</option><option value="4">自定义</option></select></label><fieldset id="custom-fields" hidden><legend>自定义事项</legend><label>事项名称<input name="eventName" maxlength="40"></label><label>开始时间<input name="startDate" type="datetime-local"></label><label>结束时间<input name="endDate" type="datetime-local"></label></fieldset><label class="checkbox"><input id="automatic-color" type="checkbox">按时段自动配色</label><label>波浪颜色<input name="accent" type="color"></label><label>圆角<input name="radius" type="number" min="0" max="40" required></label><p id="save-status" role="status"></p><footer><button id="cancel" type="button">取消</button><button id="save" type="submit">保存</button></footer></form></dialog><script type="module" src="./app.js"></script></body>
</html>
