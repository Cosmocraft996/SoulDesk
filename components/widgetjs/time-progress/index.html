<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时间进度</title><link rel="stylesheet" href="./style.css"></head>
<body data-widget="time"><main id="component"><header><h1 id="title">时间进度</h1><button id="configure" type="button" aria-label="设置时间进度">⚙</button></header><section id="periods" aria-label="各时段剩余百分比"></section><p id="status" role="status"></p></main><dialog id="settings"><form id="settings-form"><h2>时间进度设置</h2><label>标题<input name="title" maxlength="40" required></label><label>背景颜色<input name="background" type="color"></label><label>文字颜色<input name="foreground" type="color"></label><label>圆角<input name="radius" type="number" min="0" max="40" required></label><p id="save-status" role="status"></p><footer><button id="cancel" type="button">取消</button><button id="save" type="submit">保存</button></footer></form></dialog><script type="module" src="./app.js"></script></body>
</html>
