<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文件收纳盒</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="content"><header><button id="title" class="title" type="button">📁文件夹</button><div class="tools"><button id="sort" type="button" aria-label="排序" title="排序"><svg viewBox="0 0 24 24"><path d="M5 4v16m-3-3 3 3 3-3M11 5h10M11 10h7M11 15h4"/></svg></button><button id="edit" type="button" aria-label="编辑排除项目" title="编辑排除项目" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m15 3 6 6-12 12H3v-6L15 3ZM12 6l6 6M3 23h18"/></svg></button><button id="settings" type="button" aria-label="收纳盒设置" title="设置"><svg viewBox="0 0 24 24"><path d="m9 3-1 3-3 1 1 3-2 2 2 2-1 3 3 1 1 3h6l1-3 3-1-1-3 2-2-2-2 1-3-3-1-1-3H9Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></header>
<section id="scroll"><p id="empty">右键添加文件或文件夹</p><div id="grid" class="file-grid"></div></section><output id="status" role="status"></output></main>
<menu id="context" hidden><li><button id="add-file" type="button">添加文件</button></li><li><button id="add-folder" type="button">添加文件夹</button></li><li><button id="refresh" type="button">刷新列表</button></li><li><button id="refresh-icons" type="button">刷新图标</button></li></menu>
<dialog id="sort-dialog"><form id="sort-form"><h2>排序</h2><label>排序字段<select id="sort-by"><option value="name">名称</option><option value="birthTime">创建时间</option><option value="modifiedTime">更新时间</option></select></label><label>方向<select id="sort-mode"><option value="asc">递增</option><option value="desc">递减</option></select></label><div class="actions"><button type="submit">保存</button><button id="sort-close" type="button">关闭</button></div><p id="sort-status" role="status"></p></form></dialog>
<dialog id="config"><form id="form"><h2>文件收纳盒设置</h2><label>标题<input id="name" required maxlength="120"></label><label>网格数量<input id="columns" type="number" min="4" max="15" required></label><label>主文件夹<input id="folder" readonly placeholder="选择主文件夹"></label><div class="actions"><button id="choose-root" type="button">选择主目录</button><button id="clear-root" type="button">清除主目录</button></div>
<label>格式过滤<input id="include" maxlength="1000" placeholder="多个用空格隔开，例如 .py .apk .exe"></label><div id="formats" class="formats"></div><label>排除格式<input id="exclude" maxlength="1000" placeholder="多个用空格隔开，例如 .avi .pdf .gif"></label><div class="colors"><label>背景<input id="background" type="color"></label><label>文字<input id="color" type="color"></label><label>圆角<input id="radius" type="number" min="0" max="80" required></label></div>
<div class="excluded-heading"><span>已排除的项目</span><button id="restore-all" type="button">全部恢复显示</button></div><div id="excluded" class="excluded"></div><p class="hint">排除只影响收纳盒显示，原文件保留。添加文件和文件夹也可使用右键菜单。</p><div class="actions"><button type="submit">保存设置</button><button id="close" type="button">关闭</button></div><p id="config-status" role="status"></p></form></dialog><script type="module" src="./app.js"></script></body></html>
