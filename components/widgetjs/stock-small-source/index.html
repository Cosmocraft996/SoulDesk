<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>股票</title></head><body><main id="root"><header><strong id="name">正在读取证券…</strong><div><button id="refresh" type="button" aria-label="刷新">↻</button><button id="settings" type="button" aria-label="股票设置">⚙</button></div></header><div class="identity"><span id="exchange"></span><span id="code"></span><span id="ratio">—</span></div><div id="price">—</div><output id="status" role="status"></output><div class="chart"><canvas id="chart" aria-label="证券当日分时图"></canvas></div><footer><div>东方财富 · 分时末点（最新价）</div><div id="time"></div><div>分时时间按源原文，时区未提供 · 不参与币安警报</div></footer></main><dialog id="config"><form id="form"><h2>股票小组件设置</h2><label for="search">搜索代码/名称</label><div class="search"><input id="search" type="text" maxlength="80" placeholder="例如 01810 / 小米"><button id="search-button" type="button">搜索</button></div><p id="search-status" role="status"></p><div id="results" class="results"></div><p id="selected"></p><label>红涨绿跌<input id="upColorRed" type="checkbox"></label><label>背景<input id="background" type="color"></label><label>文字<input id="foreground" type="color"></label><label>主色<input id="primary" type="color"></label><label>边框<input id="border" type="color"></label><label>圆角<input id="radius" type="number" min="0" max="40" required></label><p id="error" role="status"></p><div class="actions"><button id="close" type="button">取消</button><button id="save" type="submit">保存</button></div></form></dialog><script type="module" src="./app.js"></script></body></html>
