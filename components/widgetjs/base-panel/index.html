<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>监控面板</title><link rel="stylesheet" href="./style.css"></head>
<body><main><header><b>Monitor</b><button id="settings" type="button" aria-label="监控面板设置" title="监控面板设置">⚙</button></header><section class="columns">
<article id="cpu-column"><div>CPU</div><div class="circle"><canvas id="cpu-canvas" width="100" height="100"></canvas><b id="cpu-value">—</b></div><div id="cpu-subtitle">— C</div></article>
<article id="memory-column"><div>Mem</div><div class="circle"><canvas id="memory-canvas" width="100" height="100"></canvas><b id="memory-value">—</b></div><div id="memory-subtitle">— GB</div></article>
<article id="gpu-column"><div>GPU</div><div class="circle"><canvas id="gpu-canvas" width="100" height="100"></canvas><b id="gpu-value">—</b></div><div id="gpu-subtitle">— ℃</div></article>
<article id="network-column" class="network"><div>Net</div><div id="download">↓ —</div><div id="received" class="cumulative">—</div><div id="upload">↑ —</div><div id="sent" class="cumulative">—</div></article>
</section><output id="status" role="status"></output></main><dialog id="config"><form id="form"><h2>监控面板设置</h2><label>字体大小<input id="fontSize" type="number" min="8" max="24" required></label><label>背景颜色<input id="background" type="color"></label><label>文字颜色<input id="color" type="color"></label><label>分隔线<input id="divider" type="color"></label><label>圆角<input id="radius" type="number" min="0" max="60" required></label><div class="actions"><button id="save" type="submit">保存</button><button id="close" type="button">关闭</button></div><p id="save-error" role="status"></p></form></dialog><script type="module" src="./app.js"></script></body></html>
