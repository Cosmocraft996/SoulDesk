<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电子木鱼</title><link rel="stylesheet" href="./style.css"></head>
<body><main id="component"><div class="toolbar"><button id="music" title="背景音乐" aria-label="播放背景音乐" aria-pressed="false">♫</button><button id="settings" aria-label="设置">⚙</button></div><button id="fish" class="fish" aria-label="敲木鱼"><img src="./wooden_fish.png" alt="木鱼" draggable="false"></button><div id="count">功德数：0</div><output id="message" role="status"></output></main>
<dialog id="dialog"><form id="form"><label>背景颜色<input name="background" type="color" required></label><label>文字颜色<input name="foreground" type="color" required></label><label>圆角<input name="radius" type="number" min="0" max="40" required></label><output id="error" role="status"></output><div class="actions"><button id="cancel" type="button">取消</button><button type="submit">保存</button></div></form></dialog><script type="module" src="./app.js"></script></body></html>
