<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主流虚拟币</title></head><body><main id="root"><header><span id="connection">主流虚拟币</span><div><button id="refresh" type="button" aria-label="刷新报价">↻</button><button id="settings" type="button" aria-label="主流虚拟币设置">⚙</button></div></header><div id="list" class="list"></div><output id="status" role="status"></output><footer>OKX网页币种报价 · USD<br>非指定交易对；来源时间随每行报价显示</footer></main>
<dialog id="config"><form id="form"><h2>主流虚拟币设置</h2><label>显示更新间隔<select id="refreshMs"><option value="3000">3秒</option><option value="10000">10秒</option><option value="30000">30秒</option><option value="60000">1分钟</option></select></label><p>仅控制报价显示的更新间隔，行情连接保持运行。</p><label>红涨绿跌<input id="upColorRed" type="checkbox"></label><fieldset><legend>本实例网络</legend><label>代理模式<select id="proxyMode"><option value="inherit">跟随主程序</option><option value="direct">直接连接</option><option value="http">HTTP代理</option><option value="socks5">SOCKS5代理</option></select></label><label>主机<input id="proxyHost" type="text" maxlength="253" placeholder="127.0.0.1"></label><label>端口<input id="proxyPort" type="number" min="0" max="65535"></label></fieldset><label>背景<input id="background" type="color"></label><label>文字<input id="foreground" type="color"></label><label>主色<input id="primary" type="color"></label><label>边框<input id="border" type="color"></label><label>圆角<input id="radius" type="number" min="0" max="40" required></label><p id="error" role="status"></p><div class="actions"><button id="close" type="button">取消</button><button id="save" type="submit">保存</button></div></form></dialog><script type="module" src="./app.js"></script></body></html>
